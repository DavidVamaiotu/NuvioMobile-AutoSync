name: AutoSync Release

# Release trigger: publish current subtitle-autosync revision


on:
  workflow_dispatch:
    inputs:
      release_suffix:
        description: Suffix appended to the official Nuvio tag
        required: false
        type: string
        default: autosync
      sync_official_release:
        description: Merge the official release before building
        required: true
        type: boolean
        default: true
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/mirror-nuvio-release.yml"
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: autosync-branch-update
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout AutoSync branch
        uses: actions/checkout@v6
        with:
          ref: subtitle-autosync
          fetch-depth: 0

      - name: Find latest official Nuvio release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_TAG="$(
            gh api repos/NuvioMedia/NuvioMobile/releases \
              --jq '[.[] | select(.draft == false)][0].tag_name'
          )"

          if [[ -z "$UPSTREAM_TAG" || "$UPSTREAM_TAG" == "null" ]]; then
            echo "No official Nuvio release found"
            exit 1
          fi

          RELEASE_SUFFIX="${{ inputs.release_suffix }}"
          PREFIX="${UPSTREAM_TAG}-autosync."
          BASE_TAG="${UPSTREAM_TAG}-autosync"
          MAX_REVISION=0
          BASE_EXISTS=false

          while IFS= read -r TAG; do
            if [[ "$TAG" == "$BASE_TAG" ]]; then
              BASE_EXISTS=true
            elif [[ "$TAG" == "$PREFIX"* ]]; then
              REVISION="${TAG#"$PREFIX"}"
              if [[ "$REVISION" =~ ^[0-9]+$ ]] && (( REVISION > MAX_REVISION )); then
                MAX_REVISION="$REVISION"
              fi
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          )

          PREVIOUS_TAG=""
          if (( MAX_REVISION > 0 )); then
            PREVIOUS_TAG="${PREFIX}${MAX_REVISION}"
          elif [[ "$BASE_EXISTS" == "true" ]]; then
            PREVIOUS_TAG="$BASE_TAG"
          fi

          # A workflow-file push is an explicit fork release trigger. Pick the
          # next revision for the current upstream tag so the new fork code is
          # actually published without changing scheduled mirror behavior.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$BASE_EXISTS" == "true" || "$MAX_REVISION" -gt 0 ]]; then
              RELEASE_SUFFIX="autosync.$(( MAX_REVISION + 1 ))"
            else
              RELEASE_SUFFIX="autosync"
            fi
          elif [[ -z "$RELEASE_SUFFIX" ]]; then
            RELEASE_SUFFIX="autosync"
          fi

          AUTOSYNC_TAG="${UPSTREAM_TAG}-${RELEASE_SUFFIX}"

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "autosync_tag=$AUTOSYNC_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          echo "Official Nuvio release: $UPSTREAM_TAG"
          echo "AutoSync release: $AUTOSYNC_TAG"

          if gh release view "$AUTOSYNC_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing new
        if: steps.version.outputs.already_exists == 'true'
        run: |
          echo "${{ steps.version.outputs.autosync_tag }} already exists."
          echo "Nothing to build."

      - name: Configure Git
        if: steps.version.outputs.already_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch exact official Nuvio release
        if: steps.version.outputs.already_exists == 'false'
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git

          git fetch upstream cmp-rewrite
          git fetch upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/nuvio-$UPSTREAM_TAG"

      - name: Sync exact official release
        if: steps.version.outputs.already_exists == 'false' && (github.event_name != 'workflow_dispatch' || inputs.sync_official_release)
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          BASE_FILE=".github/nuvio-upstream-base"
          RELEASE_COMMIT="$(git rev-parse "refs/tags/nuvio-$UPSTREAM_TAG^{commit}")"

          if [[ ! -f "$BASE_FILE" ]]; then
            echo "Missing $BASE_FILE; refusing to guess the last synced upstream commit." >&2
            exit 1
          fi

          UPSTREAM_BASE="$(tr -d '[:space:]' < "$BASE_FILE")"

          if [[ -z "$UPSTREAM_BASE" ]]; then
            echo "$BASE_FILE is empty." >&2
            exit 1
          fi

          if ! git cat-file -e "$UPSTREAM_BASE^{commit}" 2>/dev/null; then
            echo "Recorded upstream base $UPSTREAM_BASE is not available locally." >&2
            exit 1
          fi

          if [[ "$UPSTREAM_BASE" == "$RELEASE_COMMIT" ]]; then
            echo "Release $UPSTREAM_TAG is already synced."
          elif git merge-base --is-ancestor "$RELEASE_COMMIT" "$UPSTREAM_BASE"; then
            echo "Current AutoSync branch already contains $UPSTREAM_TAG via newer upstream state $UPSTREAM_BASE."
          elif git merge-base --is-ancestor "$UPSTREAM_BASE" "$RELEASE_COMMIT"; then
            echo "Applying release delta $UPSTREAM_BASE..$RELEASE_COMMIT"

            git diff --binary --full-index "$UPSTREAM_BASE" "$RELEASE_COMMIT" -- \
              . ':(exclude).github/workflows/**' > /tmp/nuvio-release.patch

            if [[ -s /tmp/nuvio-release.patch ]]; then
              git apply --3way --index /tmp/nuvio-release.patch
            else
              echo "Release delta only changed excluded fork-owned workflow files."
            fi

            printf '%s\n' "$RELEASE_COMMIT" > "$BASE_FILE"
            git add "$BASE_FILE"

            if git diff --cached --quiet; then
              echo "No release source changes to commit."
            else
              git commit -m "Sync Nuvio $UPSTREAM_TAG"
            fi
          else
            echo "Recorded upstream base $UPSTREAM_BASE and release $RELEASE_COMMIT have diverged." >&2
            echo "Refusing an unsafe automatic release sync." >&2
            exit 1
          fi

      - name: Generate AutoSync changelog
        if: steps.version.outputs.already_exists == 'false'
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          {
            echo "## AutoSync changelog"
            echo
            if [[ -n "$PREVIOUS_TAG" ]] && git rev-parse --verify --quiet "$PREVIOUS_TAG^{commit}" >/dev/null; then
              CHANGES="$(
                git log --reverse --no-merges --pretty=format:'%s' "$PREVIOUS_TAG..HEAD" -- . ':(exclude).github/workflows/**' |
                  grep -Ev '^(Trigger AutoSync release|Release .*autosync|Sync Nuvio )' || true
              )"
            else
              CHANGES="$(
                git log -20 --reverse --no-merges --pretty=format:'%s' -- . ':(exclude).github/workflows/**' |
                  grep -Ev '^(Trigger AutoSync release|Release .*autosync|Sync Nuvio )' || true
              )"
            fi

            if [[ -n "$CHANGES" ]]; then
              while IFS= read -r line; do
                printf -- '- %s\n' "$line"
              done <<< "$CHANGES"
            else
              echo "- Rebuilt from the current subtitle-autosync branch."
            fi

            echo
            echo "Based on official Nuvio $UPSTREAM_TAG."
          } > autosync-release-notes.md

          cat autosync-release-notes.md

      - name: Read exact Nuvio version code
        if: steps.version.outputs.already_exists == 'false'
        id: upstream
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          VERSION_FILE="$(
            git show \
              "refs/tags/nuvio-$UPSTREAM_TAG:iosApp/Configuration/Version.xcconfig"
          )"

          VERSION_CODE="$(
            printf '%s\n' "$VERSION_FILE" |
            sed -nE \
              's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' |
            head -n1
          )"

          if [[ -z "$VERSION_CODE" ]]; then
            echo "Could not determine official Nuvio versionCode"
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Official versionCode: $VERSION_CODE"

      - name: Use exact Nuvio version code
        if: steps.version.outputs.already_exists == 'false'
        env:
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
        run: |
          sed -i -E \
            "s/^CURRENT_PROJECT_VERSION[[:space:]]*=.*/CURRENT_PROJECT_VERSION=$VERSION_CODE/" \
            iosApp/Configuration/Version.xcconfig

      - name: Set up Java
        if: steps.version.outputs.already_exists == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.version.outputs.already_exists == 'false'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        if: steps.version.outputs.already_exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ||
                -z "$STORE_PASSWORD" ||
                -z "$KEY_ALIAS" ||
                -z "$KEY_PASSWORD" ]]; then
            echo "Missing AutoSync signing secret"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/autosync-release.jks"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          {
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"

            # Public Nuvio integration configuration
            echo "SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6"
            echo "SIMKL_REDIRECT_URI=nuvio://auth/simkl"
            echo "SIMKL_APP_NAME=nuvio"
            echo "INTRODB_API_URL=https://api.introdb.app/"
            echo "IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/"
            echo "IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/"
          } > local.properties

      - name: Add Seekr API key
        if: steps.version.outputs.already_exists == 'false'
        env:
          SEEKR_API_KEY: ${{ secrets.SEEKR_API_KEY }}
        run: |
          # Seek-preview thumbnails stay off in builds without the secret.
          if [[ -n "$SEEKR_API_KEY" ]]; then
            printf '\nSEEKR_API_KEY=%s\n' "$SEEKR_API_KEY" >> local.properties
          else
            echo "::warning::SEEKR_API_KEY secret is not set; seek previews are disabled in this build"
          fi

      - name: Add Trakt credentials
        if: steps.version.outputs.already_exists == 'false'
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          # Trakt login stays unavailable in builds without both secrets.
          if [[ -n "$TRAKT_CLIENT_ID" && -n "$TRAKT_CLIENT_SECRET" ]]; then
            printf '\nTRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" >> local.properties
          else
            echo "::warning::TRAKT_CLIENT_ID or TRAKT_CLIENT_SECRET secret is not set; Trakt login is disabled in this build"
          fi

      - name: Build signed AutoSync release APKs
        if: steps.version.outputs.already_exists == 'false'
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.autosync_tag }}
        run: |
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.app.versionName="$AUTOSYNC_TAG" \
            --stacktrace

      - name: Show generated APKs
        if: steps.version.outputs.already_exists == 'false'
        run: |
          find androidApp/build/outputs/apk/full/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print

      - name: Verify APKs exist
        if: steps.version.outputs.already_exists == 'false'
        run: |
          APK_COUNT="$(
            find androidApp/build/outputs/apk/full/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' |
            wc -l
          )"

          if [[ "$APK_COUNT" -eq 0 ]]; then
            echo "No release APKs were produced"
            exit 1
          fi

          echo "Produced $APK_COUNT APKs"

      - name: Push merged Nuvio release
        if: steps.version.outputs.already_exists == 'false'
        run: |
          git push origin HEAD:subtitle-autosync

      - name: Create AutoSync GitHub release
        if: steps.version.outputs.already_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          AUTOSYNC_TAG: ${{ steps.version.outputs.autosync_tag }}
        run: |
          gh release create "$AUTOSYNC_TAG" \
            androidApp/build/outputs/apk/full/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target subtitle-autosync \
            --title "$AUTOSYNC_TAG" \
            --notes-file autosync-release-notes.md
