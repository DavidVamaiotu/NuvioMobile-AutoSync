name: Sync Nuvio Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: autosync-branch-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AutoSync branch
        uses: actions/checkout@v6
        with:
          ref: subtitle-autosync
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official Nuvio
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch upstream cmp-rewrite

      - name: Apply upstream delta
        run: |
          set -euo pipefail

          BASE_FILE=".github/nuvio-upstream-base"
          if [[ ! -f "$BASE_FILE" ]]; then
            echo "Missing $BASE_FILE; refusing to guess the last synced upstream commit." >&2
            exit 1
          fi

          UPSTREAM_BASE="$(tr -d '[:space:]' < "$BASE_FILE")"
          UPSTREAM_HEAD="$(git rev-parse upstream/cmp-rewrite)"

          if [[ -z "$UPSTREAM_BASE" ]]; then
            echo "$BASE_FILE is empty." >&2
            exit 1
          fi

          if ! git cat-file -e "$UPSTREAM_BASE^{commit}" 2>/dev/null; then
            echo "Recorded upstream base $UPSTREAM_BASE is not available locally." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$UPSTREAM_BASE" "$UPSTREAM_HEAD"; then
            echo "Recorded upstream base $UPSTREAM_BASE is not an ancestor of $UPSTREAM_HEAD." >&2
            echo "Upstream may have been rewritten; refusing an unsafe automatic sync." >&2
            exit 1
          fi

          if [[ "$UPSTREAM_BASE" == "$UPSTREAM_HEAD" ]]; then
            echo "Already synced to upstream $UPSTREAM_HEAD."
          else
            echo "Applying upstream delta $UPSTREAM_BASE..$UPSTREAM_HEAD"

            git diff --binary --full-index "$UPSTREAM_BASE" "$UPSTREAM_HEAD" -- \
              . ':(exclude).github/workflows/**' > /tmp/nuvio-upstream.patch

            if [[ -s /tmp/nuvio-upstream.patch ]]; then
              git apply --3way --index /tmp/nuvio-upstream.patch
            else
              echo "Upstream delta only changed excluded fork-owned workflow files."
            fi

            printf '%s\n' "$UPSTREAM_HEAD" > "$BASE_FILE"
            git add "$BASE_FILE"
          fi

          if git diff --cached --quiet; then
            echo "No upstream source changes to commit."
          else
            git commit -m "Sync Nuvio upstream"
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local properties
        run: touch local.properties

      - name: Test merged AutoSync
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Push merge to AutoSync branch
        run: git push origin HEAD:subtitle-autosync
