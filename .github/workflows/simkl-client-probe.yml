name: Temporary SIMKL Client ID Probe

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/simkl-client-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Nuvio APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p probe/mobile probe/tv

          gh release download 0.4.26-beta \
            --repo NuvioMedia/NuvioMobile \
            --pattern 'androidApp-full-arm64-v8a-release.apk' \
            --dir probe/mobile

          gh release download 1.0.0 \
            --repo NuvioMedia/NuvioTV \
            --pattern 'app-full-arm64-v8a-release.apk' \
            --dir probe/tv

      - name: Extract DEX string candidates
        run: |
          set -euo pipefail

          extract_ids() {
            local apk="$1"
            local out="$2"
            mkdir -p "$out"
            unzip -q "$apk" 'classes*.dex' -d "$out"
            find "$out" -name 'classes*.dex' -print0 \
              | xargs -0 strings -n 64 \
              | grep -E '^[0-9a-f]{64}$' \
              | sort -u
          }

          extract_ids probe/mobile/androidApp-full-arm64-v8a-release.apk probe/mobile/dex > probe/mobile/ids.txt || true
          extract_ids probe/tv/app-full-arm64-v8a-release.apk probe/tv/dex > probe/tv/ids.txt || true

          echo '=== OFFICIAL MOBILE 64-HEX STRINGS ==='
          cat probe/mobile/ids.txt || true
          echo
          echo '=== OFFICIAL TV 64-HEX STRINGS ==='
          cat probe/tv/ids.txt || true
          echo
          echo '=== INTERSECTION ==='
          comm -12 probe/mobile/ids.txt probe/tv/ids.txt || true
          echo
          echo '=== DOES CURRENT AUTOSYNC ID APPEAR? ==='
          CURRENT='a0b848cdb58e2e743c8efbce94edc7ca5124cc66f6f793bb91ee1f0470948096'
          grep -Fx "$CURRENT" probe/mobile/ids.txt && echo 'FOUND in Mobile' || echo 'NOT FOUND in Mobile'
          grep -Fx "$CURRENT" probe/tv/ids.txt && echo 'FOUND in TV' || echo 'NOT FOUND in TV'

      - name: Decompile SIMKL config if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(gh api repos/skylot/jadx/releases/latest --jq '.tag_name')"
          ASSET="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[].name' | grep -E '^jadx-[0-9.]+\.zip$' | head -n1)"
          gh release download "$TAG" --repo skylot/jadx --pattern "$ASSET" --dir probe
          unzip -q "probe/$ASSET" -d probe/jadx

          probe/jadx/bin/jadx --no-res --show-bad-code -d probe/mobile/src probe/mobile/androidApp-full-arm64-v8a-release.apk >/dev/null 2>&1 || true
          probe/jadx/bin/jadx --no-res --show-bad-code -d probe/tv/src probe/tv/app-full-arm64-v8a-release.apk >/dev/null 2>&1 || true

          echo '=== MOBILE SIMKL CONFIG / CLIENT ID CONTEXT ==='
          grep -Rni -E 'SimklConfig|SIMKL_CLIENT_ID|CLIENT_ID.*[0-9a-f]{64}|nuvio://auth/simkl' probe/mobile/src 2>/dev/null | head -n 80 || true
          echo
          echo '=== TV SIMKL CONFIG / CLIENT ID CONTEXT ==='
          grep -Rni -E 'SimklApiConfiguration|SIMKL_CLIENT_ID|CLIENT_ID.*[0-9a-f]{64}|oauth/pin' probe/tv/src 2>/dev/null | head -n 100 || true
