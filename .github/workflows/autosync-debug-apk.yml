name: Build AutoSync Debug APK

on:
  push:
    branches:
      - subtitle-autosync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build full debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NuvioMobile-AutoSync-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
