name: Build AutoSync Debug APK

on:
  push:
    branches:
      - subtitle-autosync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build full debug APK
    runs-on: ubuntu-latest

    env:
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fit Gradle memory to the runner
        run: |
          # gradle.properties allows 12 GB for Gradle plus 8 GB for Kotlin, more than a 16 GB
          # runner has, and R8 then gets the job killed. Cap both here, like android-release.yml.
          mkdir -p "$HOME/.gradle"
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx3g"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Create local properties
        run: |
          cat > local.properties <<'EOF'
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_REDIRECT_URI=nuvio://auth/simkl
          SIMKL_APP_NAME=nuvio
          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF

      - name: Sign with the AutoSync key
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          # Every debug APK must carry the same signature, or it cannot update the installed app.
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing AutoSync signing secret"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/autosync-debug.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - name: Add Seekr API key
        env:
          SEEKR_API_KEY: ${{ secrets.SEEKR_API_KEY }}
        run: |
          # Seek-preview thumbnails stay off in builds without the secret.
          if [[ -n "$SEEKR_API_KEY" ]]; then
            printf '\nSEEKR_API_KEY=%s\n' "$SEEKR_API_KEY" >> local.properties
          else
            echo "::warning::SEEKR_API_KEY secret is not set; seek previews are disabled in this build"
          fi

      - name: Add Trakt credentials
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          # Trakt login stays unavailable in builds without both secrets.
          if [[ -n "$TRAKT_CLIENT_ID" && -n "$TRAKT_CLIENT_SECRET" ]]; then
            printf '\nTRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" >> local.properties
          else
            echo "::warning::TRAKT_CLIENT_ID or TRAKT_CLIENT_SECRET secret is not set; Trakt login is disabled in this build"
          fi

      - name: Add MDBList client ID
        env:
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          # MDBList sign-in and tracking stay unavailable in builds without the secret.
          if [[ -n "$MDBLIST_CLIENT_ID" ]]; then
            printf '\nMDBLIST_CLIENT_ID=%s\n' "$MDBLIST_CLIENT_ID" >> local.properties
          else
            echo "::warning::MDBLIST_CLIENT_ID secret is not set; MDBList sign-in is disabled in this build"
          fi

      - name: Build full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NuvioMobile-AutoSync-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
