name: Temporary Fast SIMKL ID Probe

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/simkl-client-fast.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official APK string pools and validate against Simkl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p p/mobile p/tv

          gh release download 0.4.26-beta --repo NuvioMedia/NuvioMobile \
            --pattern 'androidApp-full-arm64-v8a-release.apk' --dir p/mobile
          gh release download 1.0.0 --repo NuvioMedia/NuvioTV \
            --pattern 'app-full-arm64-v8a-release.apk' --dir p/tv

          unzip -q p/mobile/androidApp-full-arm64-v8a-release.apk 'classes*.dex' -d p/mobile/dex
          unzip -q p/tv/app-full-arm64-v8a-release.apk 'classes*.dex' -d p/tv/dex

          find p/mobile/dex -name 'classes*.dex' -print0 \
            | xargs -0 strings -n 64 \
            | grep -oE '[0-9a-f]{64}' \
            | sort -u > p/mobile.ids || true

          find p/tv/dex -name 'classes*.dex' -print0 \
            | xargs -0 strings -n 64 \
            | grep -oE '[0-9a-f]{64}' \
            | sort -u > p/tv.ids || true

          comm -12 p/mobile.ids p/tv.ids > p/common.ids || true

          echo '=== COMMON_IDS_BEGIN ==='
          cat p/common.ids
          echo '=== COMMON_IDS_END ==='

          CURRENT='a0b848cdb58e2e743c8efbce94edc7ca5124cc66f6f793bb91ee1f0470948096'
          if grep -Fxq "$CURRENT" p/mobile.ids; then echo 'CURRENT_ID_IN_MOBILE=yes'; else echo 'CURRENT_ID_IN_MOBILE=no'; fi
          if grep -Fxq "$CURRENT" p/tv.ids; then echo 'CURRENT_ID_IN_TV=yes'; else echo 'CURRENT_ID_IN_TV=no'; fi

          echo '=== SIMKL_PIN_VALIDATION_BEGIN ==='
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            body="$(curl -sS --max-time 20 "https://api.simkl.com/oauth/pin?client_id=$cid" || true)"
            result="$(printf '%s' "$body" | jq -r '.result // .error // .message // "unknown"' 2>/dev/null || echo non_json)"
            has_code="$(printf '%s' "$body" | jq -r 'if (.user_code // "") != "" then "yes" else "no" end' 2>/dev/null || echo no)"
            echo "$cid => result=$result user_code_present=$has_code"
          done < p/common.ids

          body="$(curl -sS --max-time 20 "https://api.simkl.com/oauth/pin?client_id=$CURRENT" || true)"
          result="$(printf '%s' "$body" | jq -r '.result // .error // .message // "unknown"' 2>/dev/null || echo non_json)"
          has_code="$(printf '%s' "$body" | jq -r 'if (.user_code // "") != "" then "yes" else "no" end' 2>/dev/null || echo no)"
          echo "CURRENT_AUTOSYNC_ID => result=$result user_code_present=$has_code"
          echo '=== SIMKL_PIN_VALIDATION_END ==='
