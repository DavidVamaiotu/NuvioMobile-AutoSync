name: Update AutoSync 0.5.0-beta-autosync.2 changelog

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/update-autosync-2-changelog.yml"

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_TAG: 0.5.0-beta-autosync.2

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: subtitle-autosync

      - name: Update release changelog
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          AutoSync build based on official Nuvio 0.5.0-beta.

          ## Changelog
          - Added clearer AutoSync confidence feedback with **Excellent / Strong / Possible / Weak** match labels and a confidence percentage.
          - Improved success, failure, and reference-retry toasts so AutoSync explains what happened instead of only reporting "no reliable match".
          - Allows a localized subtitle mismatch/skip run when every other confidence gate is strong, preventing an otherwise good match from being rejected because of one concentrated group of extra or missing cues.
          - Improved reference conflict resolution: when two confident embedded-reference matches disagree by more than 300 ms, AutoSync prefers the alignment with the tighter matched-group fit.
          - Improved partial-release / CD1-CD2 matching by searching all valid placements when the external subtitle spans less than 75% of the reference timeline, instead of limiting the search to about ±180 seconds.
          - Expanded debug diagnostics to report failed confidence gates, skip-run behavior, localized mismatches, and residual timing figures.
          - Prefetches the embedded subtitle index when a stream opens, so AutoSync can start matching sooner after subtitle selection.
          - Reuses in-flight embedded-index loads instead of downloading the same index twice, while safely restarting a cancelled owning load when needed.

          This release keeps the existing lightweight SDH/PGS timing path from `0.5.0-beta-autosync.1`.
          EOF

          gh release edit "$TARGET_TAG"             --repo "$GITHUB_REPOSITORY"             --notes-file /tmp/release-notes.md

      - name: Remove one-time updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-autosync-2-changelog.yml
          git commit -m "Remove one-time AutoSync .2 changelog updater"
          git push origin HEAD:subtitle-autosync
