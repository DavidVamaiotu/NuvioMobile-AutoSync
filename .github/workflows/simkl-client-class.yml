name: Temporary SIMKL Class Probe

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/simkl-client-class.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p p/mobile p/tv p/jadx

          gh release download 0.4.26-beta --repo NuvioMedia/NuvioMobile \
            --pattern 'androidApp-full-arm64-v8a-release.apk' --dir p/mobile
          gh release download 1.0.0 --repo NuvioMedia/NuvioTV \
            --pattern 'app-full-arm64-v8a-release.apk' --dir p/tv

          TAG="$(gh api repos/skylot/jadx/releases/latest --jq '.tag_name')"
          ASSET="$(gh api repos/skylot/jadx/releases/latest --jq '.assets[].name' | grep -E '^jadx-[0-9.]+\.zip$' | head -n1)"
          gh release download "$TAG" --repo skylot/jadx --pattern "$ASSET" --dir p
          unzip -q "p/$ASSET" -d p/jadx

      - name: Extract exact official SIMKL config classes
        run: |
          set -euo pipefail

          p/jadx/bin/jadx --no-res --log-level error \
            --single-class com.nuvio.app.features.simkl.SimklConfig \
            --single-class-output p/mobile-SimklConfig.java \
            p/mobile/androidApp-full-arm64-v8a-release.apk || true

          p/jadx/bin/jadx --no-res --log-level error \
            --single-class com.nuvio.tv.BuildConfig \
            --single-class-output p/tv-BuildConfig.java \
            p/tv/app-full-arm64-v8a-release.apk || true

          echo '=== MOBILE_SIMKL_CONFIG_BEGIN ==='
          cat p/mobile-SimklConfig.java 2>/dev/null || echo 'MOBILE_CLASS_NOT_FOUND'
          echo '=== MOBILE_SIMKL_CONFIG_END ==='
          echo '=== TV_BUILDCONFIG_SIMKL_BEGIN ==='
          grep -n -E 'SIMKL|CLIENT_ID|APP_NAME' p/tv-BuildConfig.java 2>/dev/null || echo 'TV_CLASS_NOT_FOUND'
          echo '=== TV_BUILDCONFIG_SIMKL_END ==='
